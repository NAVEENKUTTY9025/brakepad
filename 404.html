<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFD428'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z'/%3E%3C/svg%3E">
    <title>404 - Page Not Found | BrakeMaster</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Color Theme - BrakeMaster (Black, White, #FFD428) */
        :root, html[data-theme='light'] {
            --color-background: #FFFFFF;
            --color-primary-text: #000000;
            --color-secondary-text: #4A4A4A;
            --color-muted-text: #6B6B6B;
            --color-accent: #FFD428;
            --color-accent-dark: #E0B800;
            --color-accent-light: #FFE066;
            --color-border: #E5E7EB;
            --color-hover: #FFF9E6;
            --color-card-bg: #FFFFFF;
            --color-nav-bg: #000000;
            --color-nav-text: #FFFFFF;
            --color-error-bg: linear-gradient(135deg, #FFF9E6 0%, #FFFFFF 100%);
            --color-shadow: rgba(0,0,0,0.08);
        }
        html[data-theme='dark'] {
            --color-background: #000000;
            --color-primary-text: #FFFFFF;
            --color-secondary-text: #D1D5DB;
            --color-muted-text: #9CA3AF;
            --color-accent: #FFD428;
            --color-accent-dark: #E0B800;
            --color-accent-light: #FFE066;
            --color-border: #2A2A2A;
            --color-hover: #1A1A1A;
            --color-card-bg: #111111;
            --color-nav-bg: #000000;
            --color-nav-text: #FFFFFF;
            --color-error-bg: linear-gradient(135deg, #0A0A0A 0%, #000000 100%);
            --color-shadow: rgba(255,212,40,0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--color-error-bg);
            color: var(--color-primary-text);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Top Bar - Logo left, toggles right (Fixed Position) */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: transparent;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary-text);
            text-decoration: none;
            font-family: 'Oswald', system-ui, sans-serif;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: var(--color-accent);
        }

        .top-controls {
            display: flex;
            gap: 0.8rem;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: rgba(255,212,40,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: var(--color-primary-text);
            border: 1px solid var(--color-border);
            font-size: 1.1rem;
        }
        .icon-btn:hover {
            background: var(--color-accent);
            color: #000000;
            border-color: var(--color-accent);
        }

        /* Main Container - Centered, Fixed Size, No Scroll */
        .error-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .error-card {
            background: var(--color-card-bg);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px var(--color-shadow);
            border: 1px solid var(--color-border);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* 404 Number Animation */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            font-family: 'Oswald', sans-serif;
            background: linear-gradient(135deg, var(--color-accent) 0%, #FFE066 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: 8px;
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            margin-bottom: 1rem;
            color: var(--color-primary-text);
        }

        .error-message {
            color: var(--color-secondary-text);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Buttons */
        .btn-primary {
            background: var(--color-accent);
            color: #000000;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: 40px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
        }
        .btn-primary:hover {
            background: #E0B800;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,212,40,0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--color-accent);
            color: var(--color-accent);
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .btn-outline:hover {
            background: var(--color-accent);
            color: #000000;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        /* Help Links */
        .help-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--color-border);
        }
        .help-links a {
            color: var(--color-muted-text);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }
        .help-links a:hover {
            color: var(--color-accent);
        }

        /* Search Box */
        .search-box {
            margin: 1.5rem 0;
            position: relative;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            border: 1px solid var(--color-border);
            border-radius: 40px;
            background: var(--color-card-bg);
            color: var(--color-primary-text);
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(255,212,40,0.2);
        }
        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-muted-text);
        }

        /* RTL Support */
        html[dir="rtl"] .search-box i {
            left: auto;
            right: 1rem;
        }
        html[dir="rtl"] .button-group {
            flex-direction: row-reverse;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .top-bar {
                padding: 0.8rem 1.2rem;
            }
            .logo {
                font-size: 1.3rem;
            }
            .icon-btn {
                width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }
            .error-card {
                padding: 1.8rem;
            }
            .error-code {
                font-size: 5rem;
                letter-spacing: 4px;
            }
            .error-title {
                font-size: 1.4rem;
            }
            .error-icon {
                font-size: 3.5rem;
            }
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            .btn-primary, .btn-outline {
                width: 100%;
                justify-content: center;
            }
        }

        /* Remove scroll from body */
        body {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Top Bar with Logo and Toggles -->
    <div class="top-bar">
        <a href="index.html" class="logo"><span>BRAKE MASTER</a>
        <div class="top-controls">
            <button id="rtl-toggle" class="icon-btn" title="RTL Mode">
                <i class="fas fa-exchange-alt"></i>
            </button>
            <button id="theme-toggle" class="icon-btn" title="Dark/Light Mode">
                <i class="fas fa-moon light-icon"></i>
                <i class="fas fa-sun dark-icon" style="display: none;"></i>
            </button>
        </div>
    </div>

    <!-- Centered Error Container -->
    <div class="error-container">
        <div class="error-card">
            <!-- Animated 404 Icon -->
            <div class="error-icon">
                <i class="fas fa-tools"></i>
            </div>
            
            <!-- 404 Number -->
            <div class="error-code">404</div>
            
            <!-- Title -->
            <h1 class="error-title">Page Not Found</h1>
            
            <!-- Message -->
            <p class="error-message">
                Oops! The page you're looking for seems to have taken a wrong turn. 
                It might have been moved, deleted, or never existed.
            </p>
            
            <!-- Search Box -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search for services, articles...">
            </div>
            
            <!-- Action Buttons -->
            <div class="button-group">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-outline">
                    <i class="fas fa-headset"></i> Contact Support
                </a>
            </div>
            
            <!-- Help Links -->
            <div class="help-links">
                <a href="service.html"><i class="fas fa-wrench"></i> Our Services</a>
                <a href="faq.html"><i class="fas fa-question-circle"></i> FAQ</a>
                <a href="blog.html"><i class="fas fa-newspaper"></i> Blog</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const htmlEl = document.documentElement;

            // ----- THEME ENGINE -----
            const themeToggle = document.getElementById('theme-toggle');
            const lightIcon = document.querySelector('.light-icon');
            const darkIcon = document.querySelector('.dark-icon');

            function setTheme(theme) {
                htmlEl.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                if (lightIcon && darkIcon) {
                    if (theme === 'dark') {
                        lightIcon.style.display = 'none';
                        darkIcon.style.display = 'inline-block';
                    } else {
                        lightIcon.style.display = 'inline-block';
                        darkIcon.style.display = 'none';
                    }
                }
            }
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
            
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const current = htmlEl.getAttribute('data-theme');
                    setTheme(current === 'light' ? 'dark' : 'light');
                });
            }

            // ----- RTL ENGINE -----
            const rtlToggle = document.getElementById('rtl-toggle');
            
            function setDirection(dir) {
                htmlEl.setAttribute('dir', dir);
                localStorage.setItem('direction', dir === 'rtl' ? 'rtl' : 'ltr');
            }
            
            const savedDir = localStorage.getItem('direction') || 'ltr';
            setDirection(savedDir);
            
            if (rtlToggle) {
                rtlToggle.addEventListener('click', () => {
                    const currentDir = htmlEl.getAttribute('dir') || 'ltr';
                    setDirection(currentDir === 'ltr' ? 'rtl' : 'ltr');
                });
            }

            // ----- SEARCH FUNCTIONALITY (Demo) -----
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const query = this.value.trim();
                        if (query) {
                            // Demo search - redirect to service page with search param
                            window.location.href = `service.html?search=${encodeURIComponent(query)}`;
                        }
                    }
                });
            }
        })();
    </script>
</body>
</html>
