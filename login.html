<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In | BrakeMaster - Mobile Brake Repair</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFD428'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z'/%3E%3C/svg%3E">
  <meta name="description" content="Sign in to your BrakeMaster account. Access your service history, schedule appointments, and manage your vehicle information.">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Three Color System: Black, White, #FFD428 */
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F5F5F5;
      --bg-card: #FFFFFF;
      --bg-nav: #000000;
      --text-primary: #000000;
      --text-secondary: #333333;
      --text-muted: #555555;
      --border-color: #E0E0E0;
      --accent: #FFD428;
      --accent-dark: #E0B800;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
      --input-bg: #FFFFFF;
      --input-border: #DDDDDD;
    }

    body.dark {
      --bg-primary: #000000;
      --bg-secondary: #0A0A0A;
      --bg-card: #111111;
      --bg-nav: #000000;
      --text-primary: #FFFFFF;
      --text-secondary: #DDDDDD;
      --text-muted: #AAAAAA;
      --border-color: #2A2A2A;
      --accent: #FFD428;
      --accent-dark: #E0B800;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.6);
      --input-bg: #1A1A1A;
      --input-border: #333333;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Top Bar - Logo left, toggles right */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: transparent;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      font-family: 'Oswald', sans-serif;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: var(--accent);
    }

    .top-controls {
      display: flex;
      gap: 0.8rem;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: rgba(255,212,40,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-size: 1.1rem;
    }
    .icon-btn:hover {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }

    /* Main Container - Centered, Fixed Size, No Scroll */
    .login-container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: 32px;
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .login-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .accent-icon {
      width: 60px;
      height: 60px;
      background: rgba(255,212,40,0.15);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    .accent-icon i {
      font-size: 2rem;
      color: var(--accent);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }
    .input-wrapper input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      border: 1px solid var(--input-border);
      border-radius: 16px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,212,40,0.2);
    }

    /* Form Options */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .checkbox input {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .checkbox span {
      color: var(--text-secondary);
    }
    .forgot-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }
    .forgot-link:hover {
      color: var(--accent-dark);
      text-decoration: underline;
    }

    /* Buttons */
    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #000000;
      font-weight: 700;
      padding: 0.9rem;
      border-radius: 40px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      margin-bottom: 1rem;
    }
    .btn-login:hover {
      background: #E0B800;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255,212,40,0.4);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider span {
      padding: 0 1rem;
    }

    /* Social Login */
    .social-login {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.7rem;
      border-radius: 40px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s;
      cursor: pointer;
    }
    .social-btn:hover {
      border-color: var(--accent);
      background: rgba(255,212,40,0.1);
    }
    .social-btn i {
      font-size: 1.1rem;
    }
    .social-btn i.fa-google { color: #DB4437; }
    .social-btn i.fa-facebook-f { color: #4267B2; }

    /* Sign Up Link */
    .signup-link {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .signup-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .signup-link a:hover {
      text-decoration: underline;
    }

    /* Alert Message */
    .alert {
      padding: 0.8rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.85rem;
      text-align: center;
    }
    .alert-error {
      background: rgba(255,68,68,0.1);
      border: 1px solid #ff4444;
      color: #ff4444;
    }
    .alert-success {
      background: rgba(255,212,40,0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    /* RTL Support */
    [dir="rtl"] .input-wrapper i {
      left: auto;
      right: 1rem;
    }
    [dir="rtl"] .form-options {
      flex-direction: row-reverse;
    }

    /* Responsive */
    @media (max-width: 520px) {
      .top-bar {
        padding: 1rem 1.5rem;
      }
      .logo {
        font-size: 1.3rem;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
      }
      .login-card {
        padding: 1.8rem;
      }
      .login-header h1 {
        font-size: 1.6rem;
      }
      .social-btn span {
        display: none;
      }
      .social-btn i {
        margin: 0;
      }
      .social-btn {
        padding: 0.7rem;
      }
    }

    /* Remove scroll from body */
    body {
      overflow: hidden;
    }
  </style>
</head>
<body>

<!-- Top Bar with Logo and Toggles -->
<div class="top-bar">
  <a href="index.html" class="logo"><span>BRAKE MASTER</a>
  <div class="top-controls">
    <button id="theme-toggle" class="icon-btn" title="Dark/Light Mode"><i class="fas fa-moon"></i></button>
    <button id="rtl-toggle" class="icon-btn" title="RTL Mode"><i class="fas fa-exchange-alt"></i></button>
  </div>
</div>

<!-- Centered Login Container -->
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="accent-icon">
        <i class="fas fa-key"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to your BrakeMaster account</p>
    </div>

    <div id="alertMessage" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="john@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In</button>
    </form>

    <div class="divider">
      <span>OR CONTINUE WITH</span>
    </div>

    <div class="social-login">
      <button class="social-btn" id="googleLogin">
        <i class="fab fa-google"></i>
        <span>Google</span>
      </button>
      <button class="social-btn" id="facebookLogin">
        <i class="fab fa-facebook-f"></i>
        <span>Facebook</span>
      </button>
    </div>

    <div class="signup-link">
      Don't have an account? <a href="register.html">Create an account</a>
    </div>
  </div>
</div>

<script>
  // Theme Toggle (Dark/Light Mode)
  const themeToggle = document.getElementById('theme-toggle');
  const body = document.body;
  
  function updateThemeIcon(isDark) {
    if(themeToggle) {
      themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
  }
  
  function toggleTheme() {
    if(body.classList.contains('dark')) {
      body.classList.remove('dark');
      localStorage.setItem('theme', 'light');
      updateThemeIcon(false);
    } else {
      body.classList.add('dark');
      localStorage.setItem('theme', 'dark');
      updateThemeIcon(true);
    }
  }
  
  // Load saved theme
  if(localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark');
    updateThemeIcon(true);
  } else {
    updateThemeIcon(false);
  }
  
  if(themeToggle) {
    themeToggle.addEventListener('click', toggleTheme);
  }
  
  // RTL Toggle
  const rtlToggle = document.getElementById('rtl-toggle');
  const htmlEl = document.documentElement;
  
  function toggleRTL() {
    if(htmlEl.getAttribute('dir') === 'rtl') {
      htmlEl.removeAttribute('dir');
      localStorage.setItem('direction', 'ltr');
      if(rtlToggle) rtlToggle.innerHTML = '<i class="fas fa-exchange-alt"></i>';
    } else {
      htmlEl.setAttribute('dir', 'rtl');
      localStorage.setItem('direction', 'rtl');
      if(rtlToggle) rtlToggle.innerHTML = '<i class="fas fa-exchange-alt"></i>';
    }
  }
  
  if(rtlToggle) {
    rtlToggle.addEventListener('click', toggleRTL);
  }
  
  // Load saved direction
  if(localStorage.getItem('direction') === 'rtl') {
    htmlEl.setAttribute('dir', 'rtl');
  }
  
  // Login Form Submission
  const loginForm = document.getElementById('loginForm');
  const alertDiv = document.getElementById('alertMessage');
  
  function showAlert(message, type) {
    alertDiv.style.display = 'block';
    alertDiv.className = `alert alert-${type}`;
    alertDiv.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-triangle' : 'check-circle'}"></i> ${message}`;
    setTimeout(() => {
      alertDiv.style.display = 'none';
    }, 3000);
  }
  
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    if(!email || !password) {
      showAlert('Please enter both email and password', 'error');
      return;
    }
    
    if(!email.includes('@') || !email.includes('.')) {
      showAlert('Please enter a valid email address', 'error');
      return;
    }
    
    if(password.length < 4) {
      showAlert('Password must be at least 4 characters', 'error');
      return;
    }
    
    // Simulate successful login
    showAlert('Login successful! Redirecting to dashboard...', 'success');
    
    // Store login state in localStorage
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('userEmail', email);
    
    // Redirect after short delay
    setTimeout(() => {
      window.location.href = 'client.html';
    }, 1500);
  });
  
  // Social login simulations
  const googleBtn = document.getElementById('googleLogin');
  const facebookBtn = document.getElementById('facebookLogin');
  
  if(googleBtn) {
    googleBtn.addEventListener('click', function() {
      showAlert('Google login demo. Redirecting...', 'success');
      setTimeout(() => {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'client.html';
      }, 1000);
    });
  }
  
  if(facebookBtn) {
    facebookBtn.addEventListener('click', function() {
      showAlert('Facebook login demo. Redirecting...', 'success');
      setTimeout(() => {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'client.html';
      }, 1000);
    });
  }
  
  // Forgot password link - demo
  const forgotLink = document.querySelector('.forgot-link');
  if(forgotLink) {
    forgotLink.addEventListener('click', function(e) {
      e.preventDefault();
      showAlert('Password reset link sent to your email (demo)', 'success');
    });
  }
  
  // Check if already logged in
  if(localStorage.getItem('isLoggedIn') === 'true') {
    // Optional: auto redirect to dashboard
    // window.location.href = 'client.html';
  }
</script>
</body>
</html>
